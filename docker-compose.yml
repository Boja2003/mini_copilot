services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Dans le reseau Compose, la base s'appelle "db", pas localhost.
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 et pas localhost : dans le conteneur, localhost resout
      # d'abord en ::1 (IPv6) alors qu'uvicorn n'ecoute qu'en IPv4, et le
      # healthcheck echouerait en permanence.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      # Expose en local pour que l'ingestion (lancee hors conteneur) et
      # psql puissent s'y connecter.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
