# Golden set : les questions de reference pour mesurer le retrieval.
#
# Chaque question dit ou se trouve la reponse. Les documents et les pages ont
# ete etiquetes en lisant le texte extrait du corpus, JAMAIS avec notre propre
# retrieval : etiqueter avec le systeme qu'on evalue rendrait la mesure
# circulaire.
#
# Tout le corpus est en anglais. Les categories isolent donc l'effet de la
# langue :
#   fr_proche   question en francais, le terme cle ressemble a l'anglais
#               (Dijkstra, hypothese/hypothesis, convexe/convex)
#   fr_eloigne  question en francais, le terme cle ne ressemble pas a
#               l'anglais (parcours en largeur / breadth-first search)
#   en          groupe temoin : questions en anglais
#   hors_sujet  rien a trouver ; sert a l'evaluation de la generation
#
# `paire` relie une question francaise a la meme question posee en anglais :
# l'ecart entre les deux mesure la langue, toutes choses egales par ailleurs.
#
# `pages` n'est renseigne que lorsque l'emplacement a ete verifie dans le
# texte. En cas de doute, seul le document est attendu.
#
# BIAIS A CONNAITRE : ce golden set a ete redige par celui qui construit le
# systeme. Il doit etre relu et enrichi par quelqu'un qui connait les cours :
# ce sont tes vraies questions de revision qui comptent.

